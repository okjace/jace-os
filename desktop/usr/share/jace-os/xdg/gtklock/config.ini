# The Jace OS lock screen (gtklock). jace-lock adds the background and the time format.
# Make ~/.config/gtklock/config.ini to change it for yourself.
[main]
gtk-theme=adw-gtk3-dark
style=/usr/share/jace-os/lock/style.css
# jace-face-module starts face unlock as soon as the screen locks (when it's on in Settings).
modules=userinfo-module;powerbar-module;playerctl-module;jace-face-module
date-format=%A, %B %-d
idle-hide=true
idle-timeout=20

# Jace OS start menu (fuzzel). Opens in the top-left corner, under the start button.
[main]
font=Inter:size=11
prompt="  "
placeholder=Type to search apps
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot -e
layer=overlay
anchor=top-left
x-margin=8
y-margin=46
width=36
lines=12
horizontal-pad=16
vertical-pad=14
inner-pad=8
line-height=24
image-size-ratio=0.5
fields=name,generic,comment,categories,filename,keywords
show-actions=yes
match-counter=no
sort-result=yes

[colors]
background=16181dee
text=e6e8ebff
prompt=3ddc84ff
placeholder=8b919cff
input=e6e8ebff
match=3ddc84ff
selection=3ddc8433
selection-text=ffffffff
selection-match=5ae69aff
border=2f3540ff

[border]
width=1
radius=14

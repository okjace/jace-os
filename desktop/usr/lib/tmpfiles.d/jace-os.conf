# Jace OS virus protection: the threat log (written by clamd as clamav) and the quarantine.
d /var/lib/jace-os 0755 root root -
d /var/lib/jace-os/av 0755 clamav clamav -
f /var/lib/jace-os/av/events.log 0644 clamav clamav -
d /var/lib/jace-os/quarantine 0700 root root -
# Setup's home (its settings while it runs).
d /var/lib/jace-setup 0700 jace-setup jace-setup -

# Jace OS virus protection (ClamAV). clamd and clamonacc use this file instead of
# /etc/clamav/clamd.conf (see the drop-ins in /usr/lib/systemd/system/clamav-*.service.d).
# Settings → Virus protection turns real-time protection and scheduled scans on and off.

LogSyslog yes
LogTime yes
ExtendedDetectionInfo yes
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.ctl
LocalSocketMode 666
User clamav

# Reloading signatures one at a time keeps memory use down.
ConcurrentDatabaseReload no
MaxThreads 4
MaxFileSize 200M
MaxScanSize 400M
DetectPUA no

# Every detection (real-time, scheduled or from Settings) is logged for the alerts
# and the threat history in Settings.
VirusEvent /usr/lib/jace-os/av-event

# --- Real-time protection (clamonacc) ---------------------------------------------
# Files in home folders are scanned when they're created, downloaded, moved in or
# opened; threats are moved to quarantine (/var/lib/jace-os/quarantine).
OnAccessIncludePath /home
OnAccessExtraScanning yes
OnAccessPrevention no
OnAccessExcludeUname clamav
OnAccessExcludeRootUID yes
OnAccessMaxFileSize 100M
OnAccessMaxThreads 2

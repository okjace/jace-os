# Builds the Jace OS ISO. Push a tag like v1.0.0 to publish a release with it,
# or run it by hand to get the ISO as a workflow artifact.
name: ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed archiso git github-cli curl

      - uses: actions/checkout@v4

      - name: Get the Jace OS packages
        run: |
          mkdir -p out/repo
          gh release download repo -R "$GITHUB_REPOSITORY" -D out/repo
          cp out/repo/jace-os.db out/repo/jace-os.db.tar.gz 2>/dev/null || true

      - name: Build the ISO
        run: ./build.sh

      - name: Checksums
        run: cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: jace-os-iso
          path: |
            out/*.iso
            out/SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd out
          iso=$(ls *.iso)
          files=("$iso" SHA256SUMS)
          # GitHub release files can be at most 2 GiB: split bigger ISOs.
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d -a 1 "$iso" "$iso.part"
            files=("$iso".part* SHA256SUMS)
            note="The ISO is in parts. Join them first: \`cat $iso.part* > $iso\`"
          fi
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Jace OS ${GITHUB_REF_NAME#v}" \
            --notes "Download the ISO, write it to a USB stick (balenaEtcher, Rufus or \`dd\`), and boot from it.
          ${note:-}

          Full instructions: https://okjace.github.io/jace-os/#install" "${files[@]}"

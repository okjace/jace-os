LABEL jaceos
TEXT HELP
Start Jace OS from the USB stick. Nothing on this computer changes.
You can install it from the desktop whenever you like.
ENDTEXT
MENU LABEL Try Jace OS (without installing)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash

LABEL jaceosinstall
TEXT HELP
Start Jace OS and open the installer right away.
ENDTEXT
MENU LABEL Install Jace OS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash jace.install=1

LABEL jaceossafe
TEXT HELP
Try Jace OS with basic graphics, if the screen stays black or flickers.
ENDTEXT
MENU LABEL Try Jace OS (safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash nomodeset
